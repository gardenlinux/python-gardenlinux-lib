[tool.poetry]
name = "gardenlinux"
version = "1.0.1"
description = "Contains tools to work with the features directory of gardenlinux, for example deducting dependencies from feature sets or validating cnames"
authors = ["Garden Linux Maintainers <contact@gardenlinux.io>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "gardenlinux", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,!=3.14.1"
apt-repo = "^0.5"
boto3 = "^1.44.2"
cryptography = "^49.0.0"
jsonschema = "^4.26.0"
networkx = "^3.7"
oras = "^0.2.43"
podman = "^5.8.0"
pygit2 = "^1.21.0"
pygments = "^2.21.0"
PyGithub = "^2.10.0"
PyYAML = "^6.0.3"
semver = "^3.1.1"

[tool.poetry.group.dev.dependencies]
bandit = "^1.9.4"
boto3-stubs = { extras = ["s3"], version = "^1.44.2" }
isort = "^8.0.1"
moto = "^5.2.5"
mypy = "2.1.0"
pre-commit = "^4.7.0"
python-dotenv = "^1.2.2"
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
requests-mock = "^1.12.1"
sphinx = "9.2.0"
types-pyyaml = "^6.0.12.20261111"
types-requests = "^2.33.0.20261030"

[tool.poetry.group.docs.dependencies]
sphinx-rtd-theme = "^3.1.0"
sphinxcontrib-autoprogram = "^0.1.8"
sphinx-markdown-builder = "^0.6.11"

[tool.poetry.scripts]
gl-feature-fs-diff = "gardenlinux.features.reproducibility.__main__:main"
gl-features-parse = "gardenlinux.features.__main__:main"
gl-flavors-parse = "gardenlinux.flavors.__main__:main"
gl-gh-release = "gardenlinux.github.release.__main__:main"
gl-oci = "gardenlinux.oci.__main__:main"
gl-metadata = "gardenlinux.features.metadata_main:main"
gl-s3 = "gardenlinux.s3.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = "test-data"

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["gardenlinux"]
skip = ["test-data", ".venv", "**/__pycache", ".pytest-cache", "hack"]

[tool.bandit]
skips = ["B101", "B404"] # allow asserts, subprocesses
exclude_dirs = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
